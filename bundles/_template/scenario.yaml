# Canonical IncidentLens scenario contract.
# Copy this folder to bundles/<scenario-id>/ and populate all fields.

scenario_id: example-scenario
source: RECORDED            # RECORDED or SYNTHETIC
description: "Brief description of the incident"
alert_text: "Alert presented to IncidentLens"

baseline_window:
  start: "2026-11-10T10:00:00Z"
  end: "2026-11-10T10:10:00Z"

incident_window:
  start: "2026-11-10T10:10:00Z"
  end: "2026-11-10T10:20:00Z"

fault_injected_at: "2026-11-10T10:10:00Z"
fault_description: "Description of the injected fault"

ground_truth:
  service: payment
  category: ERROR_SPIKE

held_out: false

telemetry_files:
  - traces.jsonl
  - metrics.jsonl
