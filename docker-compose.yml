services:
  postgres:
    image: postgres:16
    container_name: incidentlens-postgres
    environment:
      POSTGRES_DB: incidentlens
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: incidentlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens -d incidentlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
